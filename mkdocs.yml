site_name: bookreader-tui
site_description: A terminal EPUB reader and personal library, built with Textual.
site_url: https://prajwalmahajan101.github.io/BookReader/
repo_url: https://github.com/prajwalmahajan101/BookReader
repo_name: prajwalmahajan101/BookReader
edit_uri: edit/main/docs/

# Source content lives under docs/site/ so the existing docs/adr/ and
# docs/screenshots/ trees don't get pulled into the nav by accident.
docs_dir: docs/site

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
        - docs/site
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - Install: install.md
  - Quick start: quickstart.md
  - Terminal images: images.md
  - Key bindings: keys.md
  - Configuration: configuration.md
  - Troubleshooting: troubleshooting.md
  - Development: development.md
  - Architecture (ADRs): adr.md
  - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/prajwalmahajan101/BookReader
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/bookreader-tui/
