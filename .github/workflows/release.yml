name: release

# Tag-driven release pipeline:
#
#   git tag v0.4.0   →   build sdist + wheel   →   PyPI (trusted publishing)
#
# Trusted publishing requires a one-time PyPI configuration:
#   https://pypi.org/manage/account/publishing/
#
# Owner:        prajwalmahajan101
# Repository:   BookReader
# Workflow:     release.yml
# Environment:  pypi      (matches `environment:` below)
#
# No API token needs to live in GitHub secrets — OIDC handles auth.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tag history needed for setuptools-scm-ish workflows

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Sanity-check tag matches pyproject version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pyproject_version=$(python -c "import tomllib,pathlib; \
            print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "Tag:        $tag_version"
          echo "pyproject:  $pyproject_version"
          if [ "$tag_version" != "$pyproject_version" ]; then
            echo "::error::Tag $tag_version does not match pyproject version $pyproject_version"
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions with twine
        run: python -m twine check --strict dist/*

      - name: Upload distributions as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bookreader-tui/
    permissions:
      id-token: write  # OIDC trusted publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub release with attached artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # Extract the section for this version from CHANGELOG.md, if present.
          notes_file=$(mktemp)
          if [ -f CHANGELOG.md ]; then
            awk -v version="${tag#v}" '
              $0 ~ "^## \\[" version "\\]" { capture=1; print; next }
              capture && /^## \[/ { exit }
              capture { print }
            ' CHANGELOG.md > "$notes_file"
          fi
          if [ ! -s "$notes_file" ]; then
            echo "Release $tag" > "$notes_file"
          fi
          gh release create "$tag" \
            --title "$tag" \
            --notes-file "$notes_file" \
            dist/*
