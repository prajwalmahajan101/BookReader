name: docs

# Build + deploy the mkdocs-material site to GitHub Pages on every
# push to main. Manual dispatch supported for testing.
#
# One-time setup (already done):
#   - Settings → Pages → Source: GitHub Actions
#
# To preview locally:
#   pip install -e ".[docs]"
#   mkdocs serve

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "mkdocs.yml"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Only one concurrent deploy; cancel any in-flight one when a new push lands.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs deps
        run: python -m pip install --upgrade pip "mkdocs>=1.6" "mkdocs-material>=9.5"

      - name: Build site
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
