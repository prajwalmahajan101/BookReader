[project]
name = "bookreader-tui"
version = "0.4.0"
description = "A terminal EPUB reader and personal library built with Textual."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Prajwal Mahajan" }]
keywords = ["epub", "ebook", "reader", "tui", "terminal", "textual", "library", "kitty", "sixel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Terminals",
    "Topic :: Text Editors :: Text Processing",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]
dependencies = [
    "textual>=0.85",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "platformdirs>=4.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "click>=8.1",
    "textual-image>=0.6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pre-commit>=3.7",
    "types-beautifulsoup4",
    "build>=1.2",
    "twine>=5.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://github.com/prajwalmahajan101/BookReader"
Repository = "https://github.com/prajwalmahajan101/BookReader"
Issues = "https://github.com/prajwalmahajan101/BookReader/issues"
Changelog = "https://github.com/prajwalmahajan101/BookReader/blob/main/CHANGELOG.md"

[project.scripts]
bookreader = "bookreader.cli:entrypoint"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bookreader.library.migrations" = ["*.sql"]
"bookreader.ui" = ["*.tcss"]
