[project]
name = "bookreader"
version = "0.4.0"
description = "A terminal EPUB reader and personal library built with Textual."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Prajwal" }]
dependencies = [
    "textual>=0.85",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "platformdirs>=4.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "click>=8.1",
    "textual-image>=0.6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pre-commit>=3.7",
    "types-beautifulsoup4",
]

[project.scripts]
bookreader = "bookreader.cli:entrypoint"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bookreader.library.migrations" = ["*.sql"]
"bookreader.ui" = ["*.tcss"]
